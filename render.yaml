# One-click alternative to Fly. Render supports WebSockets on the free tier,
# but free instances sleep after inactivity and cold-start slowly — fine for
# testing, worth the paid tier for an actual game night.
services:
  - type: web
    name: zema-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL in the dashboard
